[tools]
uv = "0.12.9"
"pipx:pre-commit" = "4.6.2"
chezmoi = "2.72.0"
bats = { version = "1.14.0", os = ["linux", "macos"] }
bitwarden = { version = "2025.10.0", os = ["linux"] }

[tasks.pre-commit-install]
run = "pre-commit install"

[tasks.pre-commit]
run = "pre-commit run --all-files --show-diff-on-failure"
run_windows = "set SKIP=source-tests&& pre-commit run --all-files --show-diff-on-failure"
