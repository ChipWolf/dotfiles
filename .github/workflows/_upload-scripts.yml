---
name: Upload and attest install scripts

"on":
  workflow_call:
    inputs:
      image_registry:
        required: true
        type: string
      image_name:
        required: true
        type: string
      tag_name:
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true

      - name: Render install scripts from templates
        env:
          DOTFILES_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image_registry }}/${{ inputs.image_name }}
          DOTFILES_ATTESTATION_REPO: ${{ github.repository }}
          DOTFILES_RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          IMAGE_NAME_LC="${IMAGE_NAME,,}"
          DOTFILES_IMAGE_NAME="${IMAGE_NAME_LC}" mise x -- chezmoi execute-template --source ./home --file install.sh.tmpl > install.sh
          DOTFILES_IMAGE_NAME="${IMAGE_NAME_LC}" mise x -- chezmoi execute-template --source ./home --file install.ps1.tmpl > install.ps1
          chmod +x install.sh

      - name: Upload install scripts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            install.sh \
            install.ps1 \
            --clobber

      - name: Attest install script provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            install.sh
            install.ps1
