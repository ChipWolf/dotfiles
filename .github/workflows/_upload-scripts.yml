---
name: Upload and attest install scripts

"on":
  workflow_call:
    inputs:
      image_registry:
        required: true
        type: string
      image_name:
        required: true
        type: string
      tag_name:
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  upload:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: true

      - name: Render install scripts from templates
        env:
          DOTFILES_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image_registry }}/${{ inputs.image_name }}
          DOTFILES_ATTESTATION_REPO: ${{ github.repository }}
          DOTFILES_RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          IMAGE_NAME_LC="${IMAGE_NAME,,}"
          DOTFILES_IMAGE_NAME="${IMAGE_NAME_LC}" mise x -- chezmoi execute-template --source ./home --file install.sh.tmpl > install.sh
          DOTFILES_IMAGE_NAME="${IMAGE_NAME_LC}" mise x -- chezmoi execute-template --source ./home --file install.ps1.tmpl > install.ps1
          chmod +x install.sh

      - name: Upload install scripts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" \
            install.sh \
            install.ps1 \
            --clobber

      - name: Attest install script provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            install.sh
            install.ps1
